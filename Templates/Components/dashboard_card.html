<div class="card dashboard">

    <h1>HashForge</h1>

    <p>Professional Cryptographic Toolkit</p>

    <div class="stats">

        <div class="stat-box">

            <h2>{{ total_hashes }}</h2>

            <p>Total Hashes</p>

        </div>

        <div class="stat-box">

            <h2>{{ text_hashes }}</h2>

            <p>Text Hashes</p>

        </div>

        <div class="stat-box">

            <h2>{{ file_hashes }}</h2>

            <p>File Hashes</p>

        </div>

        <div class="stat-box">

            <h2>{{ most_used_algorithm }}</h2>

            <p>Most Used</p>

        </div>

    </div>

</div>
